name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Verify registry package installs match lockfile
        run: |
          rm -rf .github/agents .cursor/skills .claude/agents .agents/skills
          npx agents-repo@1.13.0 install
          git diff --exit-code -- \
            agents.json agents-lock.json \
            .github/agents .cursor/skills .claude/agents .agents/skills
