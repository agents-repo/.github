name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore actionlint bootstrap cache
        uses: actions/cache@v4
        with:
          path: .cache/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/actionlint_*_checksums.txt', 'scripts/lint-workflows.mjs') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run workflow lint
        run: npm run lint:all

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Setup Chrome for Marp PDF
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Check slide PDF drift
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'
        run: npm run slides:check

      - name: Verify registry package installs from lock
        run: |
          rm -rf .github/agents .cursor/skills .claude/agents .agents/skills
          npm run agents:ci
          drift_paths=(
            agents.json
            agents-lock.json
            .github/agents
            .cursor/skills
            .claude/agents
            .agents/skills
          )
          git diff --exit-code -- "${drift_paths[@]}"
          test -z "$(git status --porcelain -- "${drift_paths[@]}")"
